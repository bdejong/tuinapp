services:
  tuinapp:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - garden-data:/app/data
      - garden-backups:/app/backups
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s
volumes:
  garden-data:
  garden-backups:
