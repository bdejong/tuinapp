services:
  tuinapp:
    image: tuinapp:local
    build: .
    restart: unless-stopped
    init: true
    environment:
      TUINAPP_PASSWORD_HASH: ${TUINAPP_PASSWORD_HASH:?Set an owner password hash in .env}
      TUINAPP_PUBLIC_ORIGIN: ${TUINAPP_PUBLIC_ORIGIN:-http://127.0.0.1:3000}
      TUINAPP_BACKUP_INTERVAL_SECONDS: ${TUINAPP_BACKUP_INTERVAL_SECONDS:-3600}
    ports:
      - "127.0.0.1:${TUINAPP_PORT:-3000}:3000"
    volumes:
      - garden-data:/app/data
      - garden-backups:/app/backups
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s
volumes:
  garden-data:
  garden-backups:
